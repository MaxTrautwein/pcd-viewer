[project]
name = "pcd-viewer"
version = "0.1.0"
description = "A basic viewer for PCD point cloud files"
readme = "README.md"
authors = [
    { name = "Max Trautwein", email = "46843360+MaxTrautwein@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyside6>=6.12.0",
    "pyvista>=0.49.2",
    "pyvistaqt>=0.13.2",
]

[project.scripts]
pcd-viewer = "pcd_viewer.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
